[project]
name = "ai-recorder-agent"
version = "0.3.0"
description = "an ai-recorder-agent based on whisper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.4.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "rank-bm25>=0.2.2",
    "requests>=2.32.5",
    "sounddevice>=0.5.3",
    "soundfile>=0.13.1",
    "uvicorn[standard]>=0.40.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
